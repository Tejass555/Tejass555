<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Monthly GitHub contributions"><defs><style>.sans{font-family:Arial,sans-serif}.serif{font-family:Georgia,serif}.muted{fill:#77766f}.reveal{opacity:0;animation:fadein .8s ease-out forwards}.bar{transform-box:fill-box;transform-origin:bottom;animation:grow .85s ease-out both}@keyframes fadein{to{opacity:1}}@keyframes grow{from{transform:scaleY(.03)}to{transform:scaleY(1)}}@media(prefers-reduced-motion:reduce){.motion,.reveal,.bar{animation:none!important;opacity:1!important;transform:none!important}}</style></defs>
<rect width="1200" height="280" rx="22" fill="#f5f4ef"/>
<text x="54" y="52" class="serif" font-size="34" fill="#171717">The work, month by month</text>
<text x="1145" y="48" text-anchor="end" class="sans muted" font-size="12">LAST 12 MONTHS</text>
<text x="54" y="91" class="sans muted" font-size="14">0 contributions in the fetched calendar</text>
<line x1="42" y1="205" x2="1158" y2="205" stroke="#d9d7cf"/><rect class="bar" style="animation-delay:0ms" x="52" y="200" width="56" height="5" rx="7" fill="#222"/><text x="80" y="230" text-anchor="middle" class="serif" font-size="13" fill="#77766f">Jan</text><rect class="bar" style="animation-delay:70ms" x="144" y="200" width="56" height="5" rx="7" fill="#222"/><text x="172" y="230" text-anchor="middle" class="serif" font-size="13" fill="#77766f">Feb</text><rect class="bar" style="animation-delay:140ms" x="236" y="200" width="56" height="5" rx="7" fill="#222"/><text x="264" y="230" text-anchor="middle" class="serif" font-size="13" fill="#77766f">Mar</text><rect class="bar" style="animation-delay:210ms" x="328" y="200" width="56" height="5" rx="7" fill="#222"/><text x="356" y="230" text-anchor="middle" class="serif" font-size="13" fill="#77766f">Apr</text><rect class="bar" style="animation-delay:280ms" x="420" y="200" width="56" height="5" rx="7" fill="#222"/><text x="448" y="230" text-anchor="middle" class="serif" font-size="13" fill="#77766f">May</text><rect class="bar" style="animation-delay:350ms" x="512" y="200" width="56" height="5" rx="7" fill="#222"/><text x="540" y="230" text-anchor="middle" class="serif" font-size="13" fill="#77766f">Jun</text><rect class="bar" style="animation-delay:420ms" x="604" y="200" width="56" height="5" rx="7" fill="#222"/><text x="632" y="230" text-anchor="middle" class="serif" font-size="13" fill="#77766f">Jul</text><rect class="bar" style="animation-delay:490ms" x="696" y="200" width="56" height="5" rx="7" fill="#222"/><text x="724" y="230" text-anchor="middle" class="serif" font-size="13" fill="#77766f">Aug</text><rect class="bar" style="animation-delay:560ms" x="788" y="200" width="56" height="5" rx="7" fill="#222"/><text x="816" y="230" text-anchor="middle" class="serif" font-size="13" fill="#77766f">Sep</text><rect class="bar" style="animation-delay:630ms" x="880" y="200" width="56" height="5" rx="7" fill="#222"/><text x="908" y="230" text-anchor="middle" class="serif" font-size="13" fill="#77766f">Oct</text><rect class="bar" style="animation-delay:700ms" x="972" y="200" width="56" height="5" rx="7" fill="#222"/><text x="1000" y="230" text-anchor="middle" class="serif" font-size="13" fill="#77766f">Nov</text><rect class="bar" style="animation-delay:770ms" x="1064" y="200" width="56" height="5" rx="7" fill="#222"/><text x="1092" y="230" text-anchor="middle" class="serif" font-size="13" fill="#77766f">Dec</text></svg>