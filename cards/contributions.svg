<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-label="GitHub contribution calendar"><defs><style>.sans{font-family:Arial,sans-serif}.serif{font-family:Georgia,serif}.muted{fill:#77766f}.reveal{opacity:0;animation:fadein .8s ease-out forwards}.bar{transform-box:fill-box;transform-origin:bottom;animation:grow .85s ease-out both}@keyframes fadein{to{opacity:1}}@keyframes grow{from{transform:scaleY(.03)}to{transform:scaleY(1)}}@media(prefers-reduced-motion:reduce){.motion,.reveal,.bar{animation:none!important;opacity:1!important;transform:none!important}}</style></defs>
